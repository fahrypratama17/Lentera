services:
  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE is required}
    container_name: lentera-frontend

    restart: unless-stopped

    ports:
      - "80:3000"

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(() => process.exit(0)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
